services:
  # Backend API
  - type: web
    name: habitalgo-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Will be added manually in Render dashboard
      - key: CLIENT_URL
        sync: false  # Will be added manually after frontend is deployed
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: habitalgo-frontend
    runtime: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false  # Will be added manually pointing to backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
